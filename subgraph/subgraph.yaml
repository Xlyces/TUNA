specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: TutorReputation
    network: matic
    source:
      address: "{{CONTRACT_ADDRESS}}"
      abi: TutorReputation
      startBlock: {{START_BLOCK}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Tutor
        - Lesson
        - Credential
      abis:
        - name: TutorReputation
          file: ./abis/TutorReputation.json
      eventHandlers:
        - event: TutorMinted(indexed uint256,indexed address)
          handler: handleTutorMinted
        - event: CredentialsStored(indexed uint256,indexed bytes32,uint8)
          handler: handleCredentialsStored
        - event: LessonCompleted(indexed uint256,uint256,uint16,uint256,uint8,uint8,indexed bytes32)
          handler: handleLessonCompleted
      file: ./src/mapping.ts

